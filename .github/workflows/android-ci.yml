name: Android CI

on:
  push:
    branches:
      - feature/v1.0.0-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Forest Pass art pack
        run: |
          mkdir -p app/src/main/assets/game_art
          unzip -o app/src/main/assets/PerimeterDefense_ForestPass_ArtPack_v2.zip -d app/src/main/assets/game_art
          echo "=== FOREST PASS ART FILES ==="
          find app/src/main/assets/game_art -type f -printf '%P (%s bytes)\\n' | sort
          echo "=== MAP MANIFEST ==="
          cat app/src/main/assets/game_art/map_manifest.json
          echo "=== ART README ==="
          cat app/src/main/assets/game_art/README_RU.txt
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle test
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perimeter-defense-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
