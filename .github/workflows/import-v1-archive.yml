name: Import v1.0.0 archive
# Archive import is triggered by updates to this workflow or manually.

on:
  push:
    branches:
      - feature/v1.0.0-complete
    paths:
      - .github/workflows/import-v1-archive.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.0.0-complete
          fetch-depth: 0

      - name: Extract project archive
        shell: bash
        run: |
          test -f perimeter-defense-v1.0-complete.zip
          mkdir -p "$RUNNER_TEMP/perimeter-import"
          unzip -oq perimeter-defense-v1.0-complete.zip -d "$RUNNER_TEMP/perimeter-import"
          cp -a "$RUNNER_TEMP/perimeter-import/." .
          rm perimeter-defense-v1.0-complete.zip

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import complete v1.0.0 game implementation"
          git push origin HEAD:feature/v1.0.0-complete
